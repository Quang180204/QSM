version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: qsm-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=qsm_cyber_mobility_2026_super_secret_key
      - CLIENT_URL=http://localhost:5173
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: qsm-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

